  // all other console warnings still show normally.
  (function(){
    const originalWarn = console.warn;
    console.warn = function(...args){
      if(typeof args[0]==='string' && args[0].includes('cdn.tailwindcss.com')) return;
      originalWarn.apply(console,args);
    };
  })();
</script>

<script>
/* ================= DATA LAYER ================= */
const LS_KEY='techrution_sms_v1';
function uid(p){return p+'_'+Math.random().toString(36).slice(2,9)}
function todayStr(){return new Date().toISOString().slice(0,10)}
function fmtMoney(n){return 'Rs. '+Number(n||0).toLocaleString('en-PK')}
function fmtDate(d){if(!d)return '-';const dt=new Date(d);return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}

function seedData(){
  const courses=[
    {id:'c1',name:'Web Development',code:'WD-101',duration:'6 Months',fee:45000,instructor:'Ahmed Raza',description:'Full-stack web development with React & Node.js',status:'Active'},
    {id:'c2',name:'Graphic Designing',code:'GD-101',duration:'4 Months',fee:30000,instructor:'Sana Malik',description:'Adobe Photoshop, Illustrator & branding basics',status:'Active'},
    {id:'c3',name:'Digital Marketing',code:'DM-101',duration:'3 Months',fee:25000,instructor:'Bilal Hussain',description:'SEO, social media & Google Ads',status:'Active'},
    {id:'c4',name:'Networking (CCNA)',code:'NW-101',duration:'6 Months',fee:50000,instructor:'Usman Tariq',description:'Cisco networking fundamentals',status:'Active'},
    {id:'c5',name:'Spoken English',code:'SE-101',duration:'2 Months',fee:12000,instructor:'Ayesha Khan',description:'Communication & fluency course',status:'Inactive'},
  ];
  const names=[['Ali Hassan','Muhammad Hassan'],['Fatima Noor','Abdul Noor'],['Zainab Bibi','Tariq Mehmood'],['Hamza Sheikh','Imran Sheikh'],['Ayesha Siddiqui','Kamran Siddiqui'],['Bilal Ahmed','Nasir Ahmed'],['Sara Khan','Javed Khan'],['Usman Ali','Riaz Ali'],['Mahnoor Fatima','Shahid Iqbal'],['Danish Raza','Ejaz Raza'],['Komal Nasir','Nasir Iqbal'],['Rehan Malik','Farhan Malik'],['Areeba Yousaf','Yousaf Khan']];
  const cities=['Karachi','Lahore','Islamabad','Rawalpindi','Faisalabad','Multan'];
  const students=names.map((n,i)=>{
    const course=courses[i%4];
    const total=course.fee, paid=[total,Math.round(total*.5),0,Math.round(total*.8)][i%4];
    const academic=['Currently Studying','Currently Studying','Graduated','Dropped / Left'][i%4===3?2:(i%5===0?1:0)];
    return {
      id:uid('s'),studentId:'TIT-'+(1001+i),name:n[0],fatherName:n[1],gender:i%2?'Female':'Male',
      dateOfBirth:`${1999+(i%6)}-0${(i%9)+1}-1${i%9}`,cnic:'',photo:'',
      phone:'03'+(10+i)+'-'+(1000000+i*137).toString().slice(0,7),alternatePhone:'',
      email:n[0].toLowerCase().replace(' ','.')+'@example.com',
      address:'Street '+(i+1)+', Block '+String.fromCharCode(65+i%5),city:cities[i%cities.length],
      courseId:course.id,batch:'Batch-'+(i%3+1),instructor:course.instructor,
      joiningDate:`2026-0${(i%6)+1}-1${i%9}`,expectedCompletionDate:`2026-1${(i%2)+1}-0${(i%9)+1}`,
      academicStatus:i%7===0?'Graduated':academic,activeStatus:i%9===0?'Inactive':'Active',notes:'',
      fee:{total,paid,paymentStatus:paid===0?'Pending':(paid>=total?'Cleared':'Partially Paid'),
        lastPaymentDate:paid>0?`2026-0${(i%6)+1}-2${i%9}`:'',nextDueDate:`2026-1${(i%2)+1}-01`,notes:''},
      createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),isDemo:true
    };
  });
  const payments=[];
  students.forEach(s=>{
    if(s.fee.paid>0){
      const admission=Math.round(s.fee.total*0.2);
      payments.push({id:uid('p'),studentId:s.id,date:s.joiningDate,amount:admission,paymentMethod:'Cash',receiptNumber:'REC-'+uid('').slice(2,7).toUpperCase(),notes:'Admission fee',createdAt:new Date().toISOString()});
      const rest=s.fee.paid-admission;
      if(rest>0)payments.push({id:uid('p'),studentId:s.id,date:s.fee.lastPaymentDate,amount:rest,paymentMethod:['Cash','Bank Transfer','Online'][Math.floor(Math.random()*3)],receiptNumber:'REC-'+uid('').slice(2,7).toUpperCase(),notes:'',createdAt:new Date().toISOString()});
    }
  });
  const attendance=[];
  students.forEach(s=>{
    for(let d=1;d<=15;d++){
      const date=`2026-09-${d<10?'0'+d:d}`;
      const r=Math.random();
      attendance.push({id:uid('a'),studentId:s.id,date,courseId:s.courseId,status:r<0.78?'Present':(r<0.9?'Absent':(r<0.96?'Late':'Leave')),notes:''});
    }
  });
  return {institute:{name:'Techrution Institute of Technology',address:'Main Boulevard, Karachi, Pakistan',phone:'021-1234567',email:'info@techrution.edu.pk',website:'www.techrution.edu.pk',logo:'',currency:'PKR',dateFormat:'DD-MM-YYYY',theme:'indigo'},
    students,courses,attendance,payments};
}

function loadDB(){
  let raw=localStorage.getItem(LS_KEY);
  if(!raw){const seed=seedData();localStorage.setItem(LS_KEY,JSON.stringify(seed));return seed;}
  try{return JSON.parse(raw);}catch(e){const seed=seedData();localStorage.setItem(LS_KEY,JSON.stringify(seed));return seed;}
}
function saveDB(){localStorage.setItem(LS_KEY,JSON.stringify(DB));}
let DB=loadDB();
DB.biometrics=DB.biometrics||[];DB.bioLog=DB.bioLog||[];DB.auditLog=DB.auditLog||[];
if(DB.institute.bioResetSec===undefined)DB.institute.bioResetSec=15;
if(!DB.bioSeeded){ // demo: pre-enroll 4 demo students so identification can be tested immediately
  DB.students.filter(s=>s.isDemo).slice(0,4).forEach((s,i)=>DB.biometrics.push({id:uid('b'),studentId:s.id,enrollmentStatus:'Enrolled',templateRef:'demo_tpl_'+uid(''),enrolledAt:new Date().toISOString(),updatedAt:new Date().toISOString(),createdAt:new Date().toISOString(),scannerDeviceId:'DEMO-SCANNER-001',fingerPosition:'Right Index',lastVerifiedAt:''}));
  DB.bioSeeded=true;saveDB();
}

/* ================ DERIVED HELPERS ================= */
function courseName(id){const c=DB.courses.find(c=>c.id===id);return c?c.name:'-';}
function studentAttendance(sid){
  const recs=DB.attendance.filter(a=>a.studentId===sid);
  const total=recs.length,present=recs.filter(r=>r.status==='Present').length,
    absent=recs.filter(r=>r.status==='Absent').length,late=recs.filter(r=>r.status==='Late').length,
    leave=recs.filter(r=>r.status==='Leave').length;
  const pct=total?Math.round((present/total)*100):0;
  return {total,present,absent,late,leave,pct};
}
function computeFeeStatus(s){
  const remaining=s.fee.total-s.fee.paid;
  let status='Pending';
  if(remaining<=0)status='Cleared';
  else if(s.fee.paid>0)status='Partially Paid';
  if(s.fee.nextDueDate && new Date(s.fee.nextDueDate)<new Date() && remaining>0)status='Overdue';
  return status;
}
function refreshFeeStatus(s){s.fee.paymentStatus=computeFeeStatus(s);}

/* ================ TOAST ================= */
function toast(msg,type='success'){
  const el=document.createElement('div');
  el.className=`fade px-4 py-3 rounded-lg shadow-lg text-sm font-medium text-white ${type==='error'?'bg-red-600':'bg-emerald-600'}`;
  el.textContent=msg;
  document.getElementById('toast').appendChild(el);
  setTimeout(()=>el.remove(),2800);
}

function openModal(html){document.getElementById('modalRoot').innerHTML=`
  <div class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4" id="modalOverlay">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto fade">${html}</div>
  </div>`;
  document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target.id==='modalOverlay')closeModal();});
}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}
function confirmDialog(msg,onYes,label='Delete'){
  openModal(`<div class="p-6">
    <h3 class="text-lg font-semibold mb-2">Please confirm</h3>
    <p class="text-slate-600 mb-6">${msg}</p>
    <div class="flex justify-end gap-2">
      <button onclick="closeModal()" class="px-4 py-2 rounded-lg border">Cancel</button>
      <button id="confirmYes" class="px-4 py-2 rounded-lg bg-red-600 text-white">${label}</button>
    </div></div>`);
  document.getElementById('confirmYes').onclick=()=>{onYes();closeModal();};
}

/* ================ DASHBOARD ================= */
function viewDashboard(){
  const st=DB.students;
  const active=st.filter(s=>s.activeStatus==='Active').length;
  const inactive=st.length-active;
  const studying=st.filter(s=>s.academicStatus==='Currently Studying').length;
  const graduated=st.filter(s=>s.academicStatus==='Graduated').length;
  const totalFee=st.reduce((a,s)=>a+s.fee.total,0);
  const paidFee=st.reduce((a,s)=>a+s.fee.paid,0);
  const pendingFee=totalFee-paidFee;
  const clearedAcc=st.filter(s=>computeFeeStatus(s)==='Cleared').length;
  const pendingAcc=st.length-clearedAcc;
  const today=DB.attendance.filter(a=>a.date===todayStr());
  const todayPresent=today.filter(a=>a.status==='Present').length;
  const overallAtt=DB.attendance.length?Math.round((DB.attendance.filter(a=>a.status==='Present').length/DB.attendance.length)*100):0;

  const cards=[
    ['Total Students',st.length,'text-indigo-600','bg-indigo-50'],
    ['Active Students',active,'text-emerald-600','bg-emerald-50'],
    ['Inactive Students',inactive,'text-red-600','bg-red-50'],
    ['Currently Studying',studying,'text-blue-600','bg-blue-50'],
    ['Graduated',graduated,'text-purple-600','bg-purple-50'],
    ['Total Courses',DB.courses.length,'text-amber-600','bg-amber-50'],
    ['Fee Pending',fmtMoney(pendingFee),'text-red-600','bg-red-50'],
    ['Fee Cleared',fmtMoney(paidFee),'text-emerald-600','bg-emerald-50'],
    [`Today's Attendance`,today.length?`${todayPresent}/${today.length}`:'No records','text-cyan-600','bg-cyan-50'],
    ['Attendance %',overallAtt+'%','text-fuchsia-600','bg-fuchsia-50'],
    ['Fingerprints Enrolled',st.filter(s=>bioEnrolled(s.id)).length,'text-emerald-600','bg-emerald-50'],
    ['Not Enrolled',st.filter(s=>!bioEnrolled(s.id)).length,'text-slate-600','bg-slate-50'],
    ['Enrollment %',(st.length?(st.filter(s=>bioEnrolled(s.id)).length/st.length*100).toFixed(1):0)+'%','text-indigo-600','bg-indigo-50'],
  ];
  setTimeout(()=>drawDashCharts(active,inactive,studying,graduated,paidFee,pendingFee),0);
  return `
  <div class="mb-5"><h1 class="text-xl font-bold">Dashboard</h1><p class="text-sm text-slate-500">Overview of ${DB.institute.name}</p></div>
  <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-5 gap-4 mb-6">
    ${cards.map(c=>`<div class="card p-4"><p class="text-xs text-slate-500 mb-1">${c[0]}</p><p class="text-2xl font-bold ${c[2]}">${c[1]}</p></div>`).join('')}
  </div>
  <div class="grid lg:grid-cols-3 gap-4">
    <div class="card p-4"><p class="font-semibold text-sm mb-3">Active vs Inactive</p><canvas id="chartActive" height="180"></canvas></div>
    <div class="card p-4"><p class="font-semibold text-sm mb-3">Studying vs Graduated</p><canvas id="chartAcademic" height="180"></canvas></div>
    <div class="card p-4"><p class="font-semibold text-sm mb-3">Fees Overview</p><canvas id="chartFees" height="180"></canvas></div>
    <div class="card p-4 lg:col-span-3"><p class="font-semibold text-sm mb-3">Students by Course</p><canvas id="chartCourse" height="90"></canvas></div>
  </div>`;
}
let chartRefs={};
function drawDashCharts(active,inactive,studying,graduated,paid,pending){
  Object.values(chartRefs).forEach(c=>c&&c.destroy());
  const ctx=id=>document.getElementById(id).getContext('2d');
  chartRefs.a=new Chart(ctx('chartActive'),{type:'doughnut',data:{labels:['Active','Inactive'],datasets:[{data:[active,inactive],backgroundColor:['#4f46e5','#e5e7eb']}]},options:{plugins:{legend:{position:'bottom'}}}});
  chartRefs.b=new Chart(ctx('chartAcademic'),{type:'doughnut',data:{labels:['Studying','Graduated','Other'],datasets:[{data:[studying,graduated,DB.students.length-studying-graduated],backgroundColor:['#0ea5e9','#8b5cf6','#f59e0b']}]},options:{plugins:{legend:{position:'bottom'}}}});
  chartRefs.c=new Chart(ctx('chartFees'),{type:'doughnut',data:{labels:['Paid','Pending'],datasets:[{data:[paid,pending],backgroundColor:['#10b981','#ef4444']}]},options:{plugins:{legend:{position:'bottom'}}}});
  const byCourse=DB.courses.map(c=>DB.students.filter(s=>s.courseId===c.id).length);
  chartRefs.d=new Chart(ctx('chartCourse'),{type:'bar',data:{labels:DB.courses.map(c=>c.name),datasets:[{label:'Students',data:byCourse,backgroundColor:'#4f46e5',borderRadius:6}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});
}

/* ================ STUDENTS LIST ================= */
function statusBadge(txt){
  const map={Active:'b-green',Inactive:'b-red','Currently Studying':'b-blue',Graduated:'b-gray','Dropped / Left':'b-red',
    Cleared:'b-green','Partially Paid':'b-yellow',Pending:'b-red',Overdue:'b-red'};
  return `<span class="badge ${map[txt]||'b-gray'}">${txt}</span>`;
}
function filteredStudents(){
  let list=[...DB.students];
  const q=(state.search||'').toLowerCase().trim();
  if(q)list=list.filter(s=>[s.name,s.studentId,s.fatherName,s.phone,s.email].join(' ').toLowerCase().includes(q));
  const f=state.filters;
  if(f.course)list=list.filter(s=>s.courseId===f.course);
  if(f.active)list=list.filter(s=>s.activeStatus===f.active);

  if(f.bio)list=list.filter(s=>bioEnrolled(s.id)===(f.bio==='Enrolled'));
  return list;
}

function deleteStudent(id){
  confirmDialog('Are you sure you want to delete this student? This action cannot be undone.',()=>{

function calcRemaining(){
  const t=Number(document.getElementById('feeTotal').value||0),p=Number(document.getElementById('feePaid').value||0);
  document.getElementById('feeRemaining').value=Math.max(t-p,0);
}
function onCourseChange(){
  const c=DB.courses.find(c=>c.id===document.getElementById('courseSelect').value);
  if(c){document.getElementById('feeTotal').value=c.fee;calcRemaining();}
}
function submitStudentForm(e,editId){
  e.preventDefault();
  const f=new FormData(e.target);
  const studentId=f.get('studentId').trim();
  const dup=DB.students.find(s=>s.studentId===studentId && s.id!==editId);
  if(dup){toast('Student ID already exists','error');return false;}
  const total=Math.max(0,Number(f.get('feeTotal')||0)), paid=Math.max(0,Number(f.get('feePaid')||0));
  if(paid>total){toast('Paid amount cannot exceed total fee','error');return false;}
  const data={
    studentId,name:f.get('name').trim(),fatherName:f.get('fatherName').trim(),gender:f.get('gender'),
    dateOfBirth:f.get('dateOfBirth'),cnic:f.get('cnic'),phone:f.get('phone'),alternatePhone:f.get('alternatePhone'),
    email:f.get('email'),address:f.get('address'),city:f.get('city'),courseId:f.get('courseId'),batch:f.get('batch'),
    instructor:f.get('instructor'),joiningDate:f.get('joiningDate'),expectedCompletionDate:f.get('expectedCompletionDate'),
    academicStatus:f.get('academicStatus'),activeStatus:f.get('activeStatus'),notes:f.get('notes'),
    fee:{total,paid,lastPaymentDate:f.get('lastPaymentDate'),nextDueDate:f.get('nextDueDate'),notes:f.get('feeNotes'),paymentStatus:''},
    updatedAt:new Date().toISOString()
  };
  data.fee.paymentStatus=computeFeeStatus(data);
  if(editId){
    const idx=DB.students.findIndex(s=>s.id===editId);
    DB.students[idx]={...DB.students[idx],...data};
    toast('Student updated successfully');
  }else{
    data.id=uid('s');data.createdAt=new Date().toISOString();data.isDemo=false;
    DB.students.push(data);
    toast('Student added successfully');
  }
  saveDB();nav('students');
  return false;
}

function submitPayment(e,sid){
  e.preventDefault();
  const f=new FormData(e.target);
  const amount=Number(f.get('amount'));
  const s=DB.students.find(s=>s.id===sid);
  if(amount>(s.fee.total-s.fee.paid)){toast('Amount exceeds remaining fee','error');return false;}
  DB.payments.push({id:uid('p'),studentId:sid,date:f.get('date'),amount,paymentMethod:f.get('method'),receiptNumber:f.get('receipt'),notes:f.get('notes'),createdAt:new Date().toISOString()});
  s.fee.paid+=amount;s.fee.lastPaymentDate=f.get('date');refreshFeeStatus(s);s.updatedAt=new Date().toISOString();
  saveDB();closeModal();toast('Payment recorded');renderMain();
  return false;
}

/* ================ BIOMETRIC MODULE ================ */
/* Layers: (1) FingerprintScannerService = hardware/SDK adapter, (2) BiometricBackend = template storage + matching,
   (3) UI below. Demo mode implements 1 & 2 locally. For a real scanner, replace FingerprintScannerService
   (marked "SDK INTEGRATION POINT") and move BiometricBackend to a secure server. */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
class BioError extends Error{constructor(code,extra){super(code);this.code=code;this.extra=extra;}}
const BIO_MSG={SCANNER_DISCONNECTED:'Fingerprint scanner is not connected. Please connect the device and try again.',POOR_QUALITY:'Poor-quality scan. Clean the sensor, press your finger firmly and try again.',DUPLICATE:'Fingerprint already enrolled.',PERMISSION:'You do not have permission to perform this action.',TIMEOUT:'The scanner timed out. Please try again.'};
const bioMsg=e=>BIO_MSG[e&&e.code]||'Something went wrong. Please try again.';
function canManageBiometrics(){return true;} // hook: connect to auth/roles later
function fmtDT(iso){const d=new Date(iso);return {date:fmtDate(iso),time:d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})};}
const sCode=id=>{const s=DB.students.find(s=>s.id===id);return s?s.studentId:'Unknown';};
const bioEnrolled=sid=>!!DB.biometrics.find(b=>b.studentId===sid);
const DemoControls={connected:true,poorNext:false,finger:'new'};

/* ---- SDK INTEGRATION POINT: replace this object with an adapter for the real scanner SDK/local bridge.
   Keep the same methods: connect, disconnect, getStatus, capture, enroll, identify, cancel, dispose. ---- */
const FingerprintScannerService={
  mode:'demo',deviceId:'DEMO-SCANNER-001',status:'Disconnected',_fresh:null,
  getStatus(){return this.status;},
  async connect(){
    if(this.status==='Initializing')return;
    this.status='Initializing';notifyScanner();await sleep(700);
    if(!DemoControls.connected){this.status='Disconnected';audit('Scanner connection failed','','Failed');notifyScanner();throw new BioError('SCANNER_DISCONNECTED');}
    this.status='Ready';audit('Scanner connected','','Success');notifyScanner();
  },
  disconnect(){if(this.status==='Disconnected')return;this.status='Disconnected';audit('Scanner disconnected','','Success');notifyScanner();},
  _fingerId(){const b=DemoControls.finger!=='new'&&BiometricBackend.get(DemoControls.finger);return b?b.templateRef:(this._fresh=this._fresh||'fp_'+uid(''));},
  async capture(){
    if(this.status!=='Ready')throw new BioError('SCANNER_DISCONNECTED');
    this.status='Scanning';notifyScanner();await sleep(1100);
    if(!DemoControls.connected){this.status='Disconnected';notifyScanner();throw new BioError('SCANNER_DISCONNECTED');}
    this.status='Ready';
    if(DemoControls.poorNext){DemoControls.poorNext=false;notifyScanner();throw new BioError('POOR_QUALITY');}
    notifyScanner();return {quality:80+Math.floor(Math.random()*15),fingerId:this._fingerId()};
  },
  async enroll(captures){const t={templateRef:captures[0].fingerId,fingerPosition:'Right Index',deviceId:this.deviceId};this._fresh=null;return t;},
  async identify(){const c=await this.capture();this._fresh=null;return {templateRef:c.fingerId};},
  cancel(){},dispose(){this.disconnect();}
};
function notifyScanner(){if(state.route==='biometric')renderMain();}

/* ---- Backend (demo: runs in browser; production: secure server, encrypted templates, or SDK-internal matching) ---- */
const BiometricBackend={
  get(sid){return DB.biometrics.find(b=>b.studentId===sid);},
  findByTemplate(ref){return DB.biometrics.find(b=>b.templateRef===ref);},
  save(sid,tpl){
    const dup=this.findByTemplate(tpl.templateRef);
    if(dup&&dup.studentId!==sid)throw new BioError('DUPLICATE',dup.studentId);
    const now=new Date().toISOString(),b=this.get(sid);
    const f={enrollmentStatus:'Enrolled',templateRef:tpl.templateRef,fingerPosition:tpl.fingerPosition,scannerDeviceId:tpl.deviceId,enrolledAt:now,updatedAt:now};
    if(b)Object.assign(b,f);else DB.biometrics.push({id:uid('b'),studentId:sid,createdAt:now,lastVerifiedAt:'',...f});
    saveDB();return !!b;
  },
  remove(sid){DB.biometrics=DB.biometrics.filter(b=>b.studentId!==sid);saveDB();},
  async identify(ref){await sleep(500);const b=this.findByTemplate(ref);if(!b)return null;b.lastVerifiedAt=new Date().toISOString();saveDB();return b.studentId;}
};
function audit(action,studentId,result){DB.auditLog.unshift({id:uid('l'),ts:new Date().toISOString(),action,studentId:studentId||'',result,deviceId:FingerprintScannerService.deviceId});DB.auditLog=DB.auditLog.slice(0,500);saveDB();}
function logIdent(sid,result){
  DB.bioLog.unshift({id:uid('v'),ts:new Date().toISOString(),studentId:sid?sCode(sid):'Unknown',result,action:'Identification',deviceId:FingerprintScannerService.deviceId});
  DB.bioLog=DB.bioLog.slice(0,500);audit('Identification',sid?sCode(sid):'',result);
}
async function ensureScanner(){
  if(state._tried)return;state._tried=true;
  const s=FingerprintScannerService.getStatus();
  if(s==='Disconnected'||s==='Error'){try{await FingerprintScannerService.connect();}catch(e){}}
}

/* ---- Demo control panel (clearly separated from real workflow) ---- */
function demoPanel(){
  const enr_=DB.biometrics.map(b=>`<option value="${b.studentId}" ${DemoControls.finger===b.studentId?'selected':''}>Finger of ${DB.students.find(s=>s.id===b.studentId)?.name||'?'}</option>`).join('');
  return `<div class="border border-dashed border-amber-400 bg-amber-50 rounded-xl p-3 text-xs space-y-2">
    <p class="font-semibold text-amber-800">DEMO CONTROLS (simulate hardware behaviour)</p>
    <label class="flex items-center gap-2"><input type="checkbox" ${DemoControls.connected?'checked':''} onchange="toggleDemoScanner(this.checked)"> Scanner plugged in</label>
    <label class="flex items-center gap-2"><input type="checkbox" ${DemoControls.poorNext?'checked':''} onchange="DemoControls.poorNext=this.checked"> Next capture is poor quality</label>
    <label class="block">Finger on scanner: <select onchange="DemoControls.finger=this.value" class="border rounded px-2 py-1 ml-1"><option value="new">New / unknown finger</option>${enr_}</select></label>
    <label class="block">Auto-reset result after (sec, 0 = never): <input type="number" min="0" value="${DB.institute.bioResetSec}" onchange="DB.institute.bioResetSec=Number(this.value)||0;saveDB()" class="border rounded px-2 py-1 w-16 ml-1"></label>
  </div>`;
}
async function toggleDemoScanner(on){
  DemoControls.connected=on;
  if(!on)FingerprintScannerService.disconnect();
  else try{await FingerprintScannerService.connect();}catch(e){}
  if(enr&&document.getElementById('modalOverlay'))drawEnroll();
}
const demoBanner=`<div class="bg-amber-100 text-amber-800 text-xs font-bold rounded-lg px-3 py-2 text-center">DEMO MODE — REAL FINGERPRINT SCANNER NOT CONNECTED</div>`;
function scannerPill(){
  const st=FingerprintScannerService.getStatus();
  const ok=st==='Ready'||st==='Scanning';const busy=st==='Initializing'||st==='Scanning';
  return `<span class="badge ${ok?'b-green':(busy?'b-yellow':'b-red')}">${ok?'🟢 Scanner Connected':(busy?'🟡 '+st:'🔴 Scanner Disconnected')} · ${st}</span>`;
}

/* ---- Enrollment workflow ---- */
let enr=null;
function openEnrollModal(sid,re){
  if(!canManageBiometrics()){toast(BIO_MSG.PERMISSION,'error');return;}
  enr={sid,re:!!re,step:0,caps:[],busy:false,err:'',done:false};
  if(FingerprintScannerService.getStatus()==='Disconnected')FingerprintScannerService.connect().catch(()=>{}).then(()=>enr&&drawEnroll());
  drawEnroll();
}
function closeEnroll(){enr=null;closeModal();}
function drawEnroll(){
  const s=DB.students.find(x=>x.id===enr.sid);
  const prompts=['Place your finger on the fingerprint scanner.','Lift your finger and place it again.','Place the same finger again.'];
  const ready=FingerprintScannerService.getStatus()==='Ready';
  openModal(`<div class="p-6 space-y-4">
    ${demoBanner}
    <h3 class="text-lg font-semibold">${enr.re?'Re-Enroll Fingerprint':'Fingerprint Enrollment'}</h3>
    <div class="grid grid-cols-2 gap-2 text-sm">
      <div><p class="text-xs text-slate-500">Student</p><p class="font-medium">${s.name}</p></div>
      <div><p class="text-xs text-slate-500">Student ID</p><p class="font-medium">${s.studentId}</p></div>
      <div><p class="text-xs text-slate-500">Status</p><p>${bioEnrolled(s.id)?'Enrolled':'Not Enrolled'}</p></div>
      <div><p class="text-xs text-slate-500">Scanner</p><p>${scannerPill()}</p></div>
    </div>
    ${enr.done?`<div class="bg-emerald-50 text-emerald-700 rounded-xl p-4 text-center font-semibold">✓ Fingerprint enrollment completed successfully.</div>
      <div class="flex justify-end"><button onclick="closeEnroll()" class="px-4 py-2 rounded-lg bg-indigo-600 text-white">Done</button></div>`:`
      <div class="text-center py-2"><p class="font-medium">${prompts[enr.step]}</p><p class="text-sm text-slate-500 mt-1">Scan ${enr.step+1} of 3</p>
        <div class="h-2 bg-slate-100 rounded-full mt-3"><div class="h-2 bg-indigo-600 rounded-full transition-all" style="width:${enr.step/3*100}%"></div></div>
        ${enr.busy?'<p class="text-sm text-amber-600 mt-3 animate-pulse">Scanning… keep your finger on the sensor</p>':''}
        ${enr.err?`<p class="text-sm text-red-600 mt-3">${enr.err}</p>`:''}</div>
      ${demoPanel()}
      <div class="flex justify-end gap-2"><button onclick="closeEnroll()" class="px-4 py-2 rounded-lg border">Cancel</button>
      ${ready?`<button ${enr.busy?'disabled':''} onclick="enrollCapture()" class="px-4 py-2 rounded-lg bg-indigo-600 text-white disabled:opacity-50">Capture (simulate finger)</button>`:`<button onclick="FingerprintScannerService.connect().catch(()=>{}).then(drawEnroll)" class="px-4 py-2 rounded-lg bg-indigo-600 text-white">Connect Scanner</button>`}</div>`}
  </div>`);
}
async function enrollCapture(){
  if(enr.busy)return;enr.busy=true;enr.err='';drawEnroll();
  try{
    const c=await FingerprintScannerService.capture();
    enr.caps.push(c);enr.step++;
    if(enr.step===3){
      const tpl=await FingerprintScannerService.enroll(enr.caps);
      const re=BiometricBackend.save(enr.sid,tpl); // old template replaced only now, after success
      audit(re?'Fingerprint re-enrolled':'Fingerprint enrolled',sCode(enr.sid),'Success');
      enr.done=true;
    }
  }catch(e){
    if(e.code==='DUPLICATE'){enr.err=`Fingerprint already enrolled. Associated Student ID: ${sCode(e.extra)}`;audit('Enrollment rejected (duplicate)',sCode(enr.sid),'Failed');enr.caps=[];enr.step=0;}
    else enr.err=bioMsg(e);
  }
  enr.busy=false;drawEnroll();if(enr.done)renderMain();
}
function reEnrollFingerprint(sid){confirmDialog('Re-enroll this student\'s fingerprint? The existing enrollment stays active until the new one succeeds.',()=>setTimeout(()=>openEnrollModal(sid,true),0),'Continue');}
function removeFingerprint(sid){
  if(!canManageBiometrics()){toast(BIO_MSG.PERMISSION,'error');return;}
  confirmDialog('Are you sure you want to remove this student\'s fingerprint enrollment?',()=>{BiometricBackend.remove(sid);audit('Fingerprint removed',sCode(sid),'Success');toast('Fingerprint enrollment removed');renderMain();},'Remove');
}
function bioProfileSection(s){
  const b=BiometricBackend.get(s.id);
  return `<div class="card p-5 no-print"><h3 class="font-semibold mb-3">Biometric / Fingerprint</h3>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm">
      <div><p class="text-slate-500 text-xs">Fingerprint Status</p><p>${b?'<span class="badge b-green">Enrolled</span>':'<span class="badge b-gray">Not Enrolled</span>'}</p></div>
      <div><p class="text-slate-500 text-xs">Enrollment Date</p><p>${b?fmtDate(b.enrolledAt):'-'}</p></div>
      <div><p class="text-slate-500 text-xs">Last Verification</p><p>${b&&b.lastVerifiedAt?fmtDate(b.lastVerifiedAt):'-'}</p></div>
      <div><p class="text-slate-500 text-xs">Finger Used</p><p>${b?b.fingerPosition:'-'}</p></div>
      <div class="col-span-2"><p class="text-slate-500 text-xs">Scanner / Device</p><p>${b?b.scannerDeviceId+' (Demo)':'-'}</p></div>
    </div>
    <div class="flex gap-2 mt-4 flex-wrap">
      ${b?`<button onclick="reEnrollFingerprint('${s.id}')" class="px-3 py-2 rounded-lg border text-sm">Re-Enroll Fingerprint</button>
      <button onclick="removeFingerprint('${s.id}')" class="px-3 py-2 rounded-lg border text-sm text-red-600">Remove Fingerprint</button>`
      :`<button onclick="openEnrollModal('${s.id}')" class="px-3 py-2 rounded-lg bg-indigo-600 text-white text-sm">Enroll Fingerprint</button>`}
    </div></div>`;
}

/* ---- Identification screen ---- */
let bio={phase:'idle'},bioTimer=null;
function bioReset(){clearTimeout(bioTimer);bio={phase:'idle'};if(state.route==='biometric')renderMain();}
async function bioSimulateScan(){
  if(bio.phase==='scanning'||bio.phase==='processing')return;
  clearTimeout(bioTimer);
  try{
    if(FingerprintScannerService.getStatus()!=='Ready')throw new BioError('SCANNER_DISCONNECTED');
    bio={phase:'scanning'};renderMain();
    const r=await FingerprintScannerService.identify();
    bio={phase:'processing'};renderMain();
    const sid=await BiometricBackend.identify(r.templateRef);
    if(sid){bio={phase:'result',sid};logIdent(sid,'Success');const sec=Number(DB.institute.bioResetSec);if(sec>0)bioTimer=setTimeout(bioReset,sec*1000);}
    else{bio={phase:'unknown'};logIdent('','Failed');}
  }catch(e){bio={phase:'error',err:bioMsg(e)};if(e.code!=='SCANNER_DISCONNECTED')logIdent('','Failed');}
  renderMain();
}
function bioResultCard(sid){
  const s=DB.students.find(x=>x.id===sid);if(!s)return '<p>Record not found.</p>';
  const att=studentAttendance(s.id),b=BiometricBackend.get(sid),rem=s.fee.total-s.fee.paid;
  const row=(k,v)=>`<div class="flex justify-between text-sm py-1"><span class="text-slate-500">${k}</span><span class="text-right font-medium">${v||'-'}</span></div>`;
  return `<div class="bg-emerald-50 border border-emerald-200 rounded-xl p-4 mb-4 flex items-center gap-4">
      <div class="w-16 h-16 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center text-2xl font-bold shrink-0">${s.name[0]}</div>
      <div><p class="text-emerald-700 font-bold">✓ STUDENT IDENTIFIED</p><p class="text-lg font-bold">${s.name}</p><p class="text-sm text-slate-600">${s.studentId} • ${courseName(s.courseId)} • ${s.activeStatus} • ${rem>0?fmtMoney(rem)+' remaining':'Fee cleared'} • Attendance ${att.pct}%</p></div></div>
    <div class="grid md:grid-cols-2 gap-x-8">
      <div><h4 class="font-semibold text-sm mt-2 mb-1">Student</h4>${row('Father',s.fatherName)}${row('Phone',s.phone)}${row('Email',s.email)}${row('Address',(s.address||'')+', '+(s.city||''))}${row('Date of Birth',fmtDate(s.dateOfBirth))}
        <h4 class="font-semibold text-sm mt-3 mb-1">Course</h4>${row('Course',courseName(s.courseId))}${row('Batch',s.batch)}${row('Instructor',s.instructor)}${row('Joined',fmtDate(s.joiningDate))}${row('Expected Completion',fmtDate(s.expectedCompletionDate))}${row('Academic',statusBadge(s.academicStatus))}${row('Status',statusBadge(s.activeStatus))}</div>
      <div><h4 class="font-semibold text-sm mt-2 mb-1">Fee</h4>${row('Total',fmtMoney(s.fee.total))}${row('Paid',fmtMoney(s.fee.paid))}${row('Remaining',fmtMoney(rem))}${row('Status',statusBadge(computeFeeStatus(s)))}${row('Last Payment',fmtDate(s.fee.lastPaymentDate))}${row('Next Due',fmtDate(s.fee.nextDueDate))}
        <h4 class="font-semibold text-sm mt-3 mb-1">Attendance</h4>${row('Total Classes',att.total)}${row('Present',att.present)}${row('Absent',att.absent)}${row('Late',att.late)}${row('Percentage',att.pct+'%')}
        <h4 class="font-semibold text-sm mt-3 mb-1">Biometric</h4>${row('Fingerprint','Enrolled')}${row('Last Verification',b&&b.lastVerifiedAt?fmtDT(b.lastVerifiedAt).date+' '+fmtDT(b.lastVerifiedAt).time:'-')}${row('Verification','<span class="badge b-green">Verified</span>')}</div>
    </div>
    <div class="flex gap-2 mt-5"><button onclick="nav('profile',{studentId:'${s.id}'})" class="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm">View Full Profile</button><button onclick="bioReset()" class="px-4 py-2 rounded-lg border text-sm">Scan Another Student</button></div>`;
}
function viewBiometric(){
  setTimeout(ensureScanner,0);
  const tab=state.bioTab||'identify',ph=bio.phase,st=FingerprintScannerService.getStatus();
  const tabs=[['identify','Identification'],['log','Verification Log'],['audit','Audit Log']].map(t=>`<button onclick="state.bioTab='${t[0]}';renderMain()" class="px-4 py-2 text-sm rounded-lg ${tab===t[0]?'bg-indigo-600 text-white':'bg-white border'}">${t[1]}</button>`).join('');
  let body='';
  if(tab==='identify'){
    let box='';
    if(ph==='result')box=`<div class="card p-5">${bioResultCard(bio.sid)}</div>`;
    else{
      let inner='';
      if(st==='Disconnected'||st==='Error'||ph==='error')inner=`<p class="text-red-600 font-medium mb-3">${ph==='error'?bio.err:BIO_MSG.SCANNER_DISCONNECTED}</p><button onclick="state._tried=false;bio={phase:'idle'};ensureScanner();renderMain()" class="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm">Connect / Retry</button>`;
      else if(ph==='unknown')inner=`<p class="text-amber-600 font-bold text-lg">⚠ Fingerprint Not Recognized</p><p class="text-sm text-slate-500 mb-4">No enrolled student was found for this fingerprint.</p><div class="flex gap-2 justify-center"><button onclick="bioReset();bioSimulateScan()" class="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm">Try Again</button><button onclick="bioReset()" class="px-4 py-2 rounded-lg border text-sm">Cancel</button><button onclick="state.filters={bio:'Not Enrolled'};state.search='';nav('students')" class="px-4 py-2 rounded-lg border text-sm">Enroll Student</button></div>`;
      else if(ph==='scanning'||ph==='processing')inner=`<p class="text-indigo-600 font-medium animate-pulse">${ph==='scanning'?'Reading fingerprint…':'Searching biometric records…'}</p>`;
      else inner=`<p class="text-slate-600 mb-1">Place your finger on the scanner.</p><p class="text-sm text-slate-400 mb-4">Waiting for fingerprint…</p><button onclick="bioSimulateScan()" class="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm">Simulate finger on scanner (demo)</button>`;
      box=`<div class="card p-8 text-center"><div class="mx-auto w-24 h-24 rounded-full border-4 ${ph==='scanning'||ph==='processing'?'border-indigo-500 animate-pulse':'border-slate-200'} flex items-center justify-center text-slate-400 mb-4">${icon('M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4','w-12 h-12')}</div>${inner}</div>`;
    }
    body=`<div class="grid lg:grid-cols-3 gap-4"><div class="lg:col-span-2">${box}</div><div>${demoPanel()}</div></div>`;
  }else if(tab==='log'){
    body=`<div class="card overflow-x-auto"><table class="w-full text-sm"><thead><tr class="border-b bg-slate-50"><th class="text-left p-3">Date</th><th class="text-left p-3">Time</th><th class="text-left p-3">Student</th><th class="text-left p-3">Result</th><th class="text-left p-3">Action</th></tr></thead><tbody>${DB.bioLog.length?DB.bioLog.slice(0,100).map(l=>{const t=fmtDT(l.ts);return `<tr class="border-b last:border-0"><td class="p-3">${t.date}</td><td class="p-3">${t.time}</td><td class="p-3">${l.studentId}</td><td class="p-3"><span class="badge ${l.result==='Success'?'b-green':'b-red'}">${l.result}</span></td><td class="p-3">${l.action}</td></tr>`;}).join(''):'<tr><td colspan="5" class="p-8 text-center text-slate-400">No verification activity yet.</td></tr>'}</tbody></table></div>`;
  }else{
    body=`<div class="card overflow-x-auto"><table class="w-full text-sm"><thead><tr class="border-b bg-slate-50"><th class="text-left p-3">Date</th><th class="text-left p-3">Time</th><th class="text-left p-3">Student</th><th class="text-left p-3">Action</th><th class="text-left p-3">Result</th></tr></thead><tbody>${DB.auditLog.length?DB.auditLog.slice(0,100).map(l=>{const t=fmtDT(l.ts);return `<tr class="border-b last:border-0"><td class="p-3">${t.date}</td><td class="p-3">${t.time}</td><td class="p-3">${l.studentId||'-'}</td><td class="p-3">${l.action}</td><td class="p-3"><span class="badge ${l.result==='Success'?'b-green':'b-red'}">${l.result}</span></td></tr>`;}).join(''):'<tr><td colspan="5" class="p-8 text-center text-slate-400">No audit entries yet.</td></tr>'}</tbody></table></div>`;
  }
  return `<div class="flex flex-wrap items-center justify-between gap-3 mb-4"><div><h1 class="text-xl font-bold">Biometric Identification</h1><p class="text-sm text-slate-500">Identify students by fingerprint</p></div>${scannerPill()}</div>
    <div class="mb-4">${demoBanner}</div><div class="flex gap-2 mb-4 flex-wrap">${tabs}</div>${body}`;
}

/* ================ MAIN RENDER ================= */
function renderMain(){
  const el=document.querySelector('main');
  let html='';
  switch(state.route){
    case 'dashboard':html=viewDashboard();break;
    case 'students':html=viewStudents();break;
    case 'addStudent':html=studentForm(null);break;
    case 'editStudent':html=studentForm(DB.students.find(s=>s.id===state.studentId));break;
    case 'profile':html=viewProfile(state.studentId);break;
    case 'attendance':html=viewAttendance();break;
    case 'fees':html=viewFees();break;
    case 'courses':html=viewCourses();break;
    case 'reports':html=viewReports();break;
    case 'settings':html=viewSettings();break;
    case 'biometric':html=viewBiometric();break;
    default:html=viewDashboard();
  }
  el.innerHTML=`<div class="fade">${html}</div>`;
  if(document.getElementById('courseSelect'))calcRemaining();
}
function render(){
  document.getElementById('app').innerHTML=layout('');
  renderMain();
}
render();
</script>
</body>
</html>
